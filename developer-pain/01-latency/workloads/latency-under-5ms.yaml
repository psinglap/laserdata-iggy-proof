# A latency workload, not a throughput one: small messages, a steady rate well below saturation,
# several subscriptions. Run it unchanged against every driver you compare.
name: latency-under-5ms
topics: 1
partitionsPerTopic: 16
messageSize: 256
payloadFile: payload/payload-256b.data   # head -c 256 /dev/urandom > payload/payload-256b.data
subscriptionsPerTopic: 4
consumerPerSubscription: 4
producersPerTopic: 4
producerRate: 100000
consumerBacklogSizeGB: 0
testDurationMinutes: 30
warmupDurationMinutes: 5
