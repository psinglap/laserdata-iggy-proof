# Apache Iggy for footprint runs. CPU and memory limits are set per run by run.sh
# through the IGGY_CPUS and IGGY_MEM variables, so the same file covers small and large nodes.
services:
  iggy:
    image: apache/iggy:${IGGY_VERSION:-0.9.0}
    ports: ["8090:8090", "3000:3000"]
    cap_add: [SYS_NICE]
    security_opt: ["seccomp:unconfined"]
    ulimits:
      memlock: {soft: -1, hard: -1}
    cpus: ${IGGY_CPUS:-2}
    mem_limit: ${IGGY_MEM:-2g}
    environment:
      # One shard per core we give the container.
      IGGY_SHARDING_CPU_ALLOCATION: ${IGGY_CPUS:-2}
      # The pool is a budget, allocated on demand. 512 MiB is the minimum the server accepts.
      IGGY_MEMORY_POOL_SIZE: ${IGGY_POOL:-512 MiB}
      # Without these the server creates the root user with a random password.
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
