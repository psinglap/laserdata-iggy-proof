services:
  iggy:
    image: apache/iggy:0.9.0
    environment:
      IGGY_ROOT_USERNAME: iggy
      IGGY_ROOT_PASSWORD: iggy
    ports: ["8090:8090", "3000:3000"]
    cap_add: [SYS_NICE]
    security_opt: ["seccomp:unconfined"]
    ulimits:
      memlock: { soft: -1, hard: -1 }

  registry:
    # In-memory storage: fine for a demo, use a database-backed setup in production.
    image: apicurio/apicurio-registry:3.3.3
    ports: ["8080:8080"]
