# LaserData footprint tests (developer-pain/03-resource-footprint).
# Every test runs on its own fresh GitHub-hosted Linux machine, all at once:
# 3 repetitions x 5 test groups = 15 machines. A final job merges their evidence,
# builds the summary and charts, and commits them to the folder's results/.
name: LaserData footprint
on:
  workflow_dispatch:
    inputs:
      scale:
        description: "1 = full run (about 40 minutes). 0.1 = quick trial (about 12 minutes), nothing is published."
        default: "1"
      reps:
        description: "Repetitions, as a JSON list"
        default: "[1,2,3]"
      profile:
        description: "Server profile: shipped (Laser Stack as is) or sized-2g (budgets shrunk to fit 2 GiB)"
        default: "sized-2g"
      publish:
        description: "Commit results to results/<profile>/ (only for scale 1)"
        default: "true"
      tests:
        description: "Tests, as a JSON list: backlog-2, backlog-10, backlog-50, producer, restart"
        default: '["backlog-2","backlog-10","backlog-50","producer","restart"]'
  schedule:
    - cron: "0 5 * * 1"  # every Monday, so new LaserData releases are re-measured

permissions:
  contents: write

concurrency: footprint-${{ inputs.profile || 'sized-2g' }}

env:
  DIR: developer-pain/03-resource-footprint

jobs:
  measure:
    name: rep ${{ matrix.rep }} · ${{ matrix.test }}
    strategy:
      fail-fast: false
      matrix:
        rep: ${{ fromJSON(inputs.reps || '[1,2,3]') }}
        test: ${{ fromJSON(inputs.tests || '["backlog-2","backlog-10","backlog-50","producer","restart"]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Data disk with write barriers (LaserData's backend refuses nobarrier disks)
        run: |
          sudo fallocate -l 40G /mnt/laserdata.img
          sudo mkfs.ext4 -q /mnt/laserdata.img
          sudo mkdir -p /data && sudo mount -o loop,barrier=1 /mnt/laserdata.img /data
          sudo mkdir -p /data/iggy /data/plane && sudo chmod -R 777 /data
          findmnt -no SOURCE,FSTYPE,OPTIONS /data; df -h / /data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r $DIR/requirements.txt
      - name: Run ${{ matrix.test }}
        env:
          FOOTPRINT_SCALE: ${{ inputs.scale || '1' }}
          FOOTPRINT_OUT: ${{ github.workspace }}/out
          FOOTPRINT_DATA_DIR: /data
          # The idle measurement rides along with the shortest test.
          TESTS: ${{ matrix.test == 'restart' && 'idle restart' || matrix.test }}
          PROFILE: ${{ inputs.profile || 'sized-2g' }}
        run: $DIR/run.sh
      - name: Keep the evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rep-${{ matrix.rep }}-${{ matrix.test }}
          path: out

  publish:
    needs: measure
    if: always() && (github.event_name == 'schedule' || (inputs.scale == '1' && inputs.publish == 'true'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          sudo apt-get install -y -q fonts-ibm-plex >/dev/null
          pip install matplotlib==3.9.2
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Merge, summarize, chart
        run: |
          R=$DIR/github/results/${{ inputs.profile || 'sized-2g' }}
          rm -rf $R && mkdir -p $R
          python $DIR/footprint/merge.py incoming $R
          python $DIR/footprint/summarize.py $R \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          python $DIR/footprint/charts.py $R
      - name: Commit results
        run: |
          git config user.name "LaserData footprint bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $DIR/results
          git commit -m "Footprint results from run ${{ github.run_id }}" || exit 0
          git pull --rebase -q && git push
